[project]
name = "aihelper"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116,<1.0",
    "uvicorn[standard]>=0.35,<1.0",
    "openai (>=3.1.0,<4.0.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
    "pgvector (>=0.5.0,<0.6.0)",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
httpx = "^0.28.1"
pytest-asyncio = "^1.4.0"

[tool.pytest.ini_options]
markers = [
    "smoke: tests that call real external services",
]

